<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /*
       * STARTUP-CONTINUITY-4: native splash is now held with
       * @capacitor/splash-screen until the React startup overlay commits.
       * Raw HTML should keep only the dark underlay safety colour.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0f1324;
      }
    </style>
    <script>
      document.documentElement.setAttribute("data-dubhub-launch-bg", "");
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <script>
      (function () {
        try {
          // Dark-first bootstrap: preserve saved light preference only.
          if (localStorage.getItem("dubhub-theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
