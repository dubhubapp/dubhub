<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style id="dubhub-shell-safety">
      /*
       * STARTUP-CONTINUITY-4: native splash is now held with
       * @capacitor/splash-screen until the React startup overlay commits.
       * Default underlay is the canonical Dark shell. The bootstrap below
       * retargets this only for an explicit semantic Light preference.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0f1324;
      }
    </style>
    <script>
      document.documentElement.setAttribute("data-dubhub-launch-bg", "");
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <script>
      (function () {
        try {
          /*
           * Must match theme.ts: THEME_STORAGE_KEY, THEME_EPOCH_KEY,
           * THEME_EPOCH_SEMANTIC_LIGHT. Legacy "light" has no epoch and
           * must paint Dark before CSS, so the old blue palette cannot flash.
           */
          var themeKey = "dubhub-theme";
          var epochKey = "dubhub-theme-epoch";
          var semanticLightEpoch = "semantic-light-1";
          var theme = localStorage.getItem(themeKey);
          var epoch = localStorage.getItem(epochKey);
          var explicitLight = theme === "light" && epoch === semanticLightEpoch;
          var root = document.documentElement;
          if (explicitLight) {
            root.classList.remove("dark");
            root.style.colorScheme = "light";
            var safety = document.getElementById("dubhub-shell-safety");
            if (safety) {
              safety.textContent =
                "html, body { margin: 0; padding: 0; background-color: #F6F8FC; }";
            }
          } else {
            if (theme === "light") {
              localStorage.setItem(themeKey, "dark");
              localStorage.removeItem(epochKey);
            }
            root.classList.add("dark");
            root.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
